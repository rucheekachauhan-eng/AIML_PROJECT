# Model hyperparameters configuration
model:
  type: "random_forest" # Options: random_forest, xgboost, lightgbm, logistic_regression, etc.
  
hyperparameters:
  random_forest:
    n_estimators: 100
    max_depth: 10
    min_samples_split: 2
    min_samples_leaf: 1
    random_state: 42
    n_jobs: -1

  logistic_regression:
    C: 1.0
    solver: "lbfgs"
    max_iter: 1000
    random_state: 42

evaluation:
  metric: "accuracy" # Options: accuracy, f1_weighted, roc_auc, rmse, mae
  cv_folds: 5
