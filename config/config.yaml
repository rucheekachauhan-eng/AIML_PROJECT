# Global pipeline & data path configurations
project:
  name: "AIML_PROJECT"
  version: "0.1.0"
  random_seed: 42

paths:
  raw_data_dir: "data/raw"
  interim_data_dir: "data/interim"
  processed_data_dir: "data/processed"
  raw_dataset_file: "data/raw/dataset.csv"
  train_data_file: "data/processed/train.csv"
  test_data_file: "data/processed/test.csv"
  models_dir: "models"
  model_file: "models/model.joblib"
  preprocessor_file: "models/preprocessor.joblib"
  reports_dir: "reports"
  figures_dir: "reports/figures"

data_split:
  test_size: 0.2
  stratify: false
  random_state: 42
